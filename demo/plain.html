<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>page-agent · 框架无关集成示例(纯 HTML,无需 Vue)</title>
  <link rel="stylesheet" href="../dist/zhuanti-agent.css" />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f5f7fa; }
    .hint { padding: 12px 16px; font-size: 13px; color: #555; background: #fff; border-bottom: 1px solid #eee; }
    .hint code { background: #f0f0f0; padding: 1px 5px; border-radius: 3px; }
    #root { width: 460px; height: calc(100vh - 48px); margin-left: auto; background: #fff; border-left: 1px solid #e5e7eb; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "zhuanti-agent": "../dist/zhuanti-agent.js",
      "zod": "https://esm.sh/zod@4.4.3",
      "@langchain/openai": "https://esm.sh/@langchain/openai@1.5.5",
      "@langchain/openai/": "https://esm.sh/@langchain/openai@1.5.5/",
      "@langchain/core": "https://esm.sh/@langchain/core@1.2.2",
      "@langchain/core/": "https://esm.sh/@langchain/core@1.2.2/",
      "@langchain/textsplitters": "https://esm.sh/@langchain/textsplitters@1.0.1",
      "@langchain/textsplitters/": "https://esm.sh/@langchain/textsplitters@1.0.1/"
    }
  }
  </script>
</head>
<body>
  <div class="hint">
    框架无关集成:本页未引入 Vue,仅 <code>&lt;script type="module"&gt;</code> 调用
    <code>createPageAgent(...).mount()</code>。peer dep(zod / @langchain/*)由 importmap + esm.sh 提供。
    运行:项目根 <code>npx serve .</code> 后访问 <code>/demo/plain.html</code>,并填入下方 apiKey。
  </div>
  <div id="root"></div>

  <script type="module">
    import { createPageAgent } from 'zhuanti-agent'
    import { z } from 'zod'

    // 预置可操作的 window 属性
    window.app = { theme: 'light', count: 0 }

    createPageAgent({
      container: '#root',
      llm: {
        apiKey: 'YOUR_API_KEY',                   // ← 填你的 key
        baseUrl: 'https://api.deepseek.com/v1',   // ← 兼容 OpenAI 协议的接口
        model: 'deepseek-chat',
      },
      systemPrompt:
        '你是页面操作助手。先用 list_window_props 查看可改属性,再用 set_window_prop 修改 window.app 上的属性。',
      windowProps: [
        { path: 'app.theme', description: '主题', schema: z.enum(['light', 'dark']) },
        { path: 'app.count', description: '计数器(整数)', schema: z.number().int() },
      ],
      debug: true,
      title: '页面内 Agent',
      placeholder: '把 app.theme 改成 dark …',
    }).mount()
  </script>
</body>
</html>
