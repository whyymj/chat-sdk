<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>page-agent-sdk · CDN 引入示例(IIFE 一行 script)</title>
  <!-- 本地预览用构建产物;发布后换成 https://unpkg.com/page-agent-sdk/dist/page-agent-sdk.css -->
  <link rel="stylesheet" href="../dist/page-agent-sdk.css" />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f5f7fa; }
    .hint { padding: 12px 16px; font-size: 13px; color: #555; background: #fff; border-bottom: 1px solid #eee; }
    .hint code { background: #f0f0f0; padding: 1px 5px; border-radius: 3px; }
    #root { width: 460px; height: calc(100vh - 48px); margin-left: auto; background: #fff; border-left: 1px solid #e5e7eb; }
    /* 开发期导航胶囊(仅 dev 用,可删) */
    .dev-nav { position: fixed; top: 12px; left: 12px; z-index: 9999; display: flex; align-items: center; gap: 2px; background: rgba(31,41,55,.92); backdrop-filter: blur(6px); padding: 5px 6px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.18); font-size: 12px; line-height: 1; user-select: none; }
    .dev-nav__brand { color: #e5e7eb; padding: 0 8px 0 4px; border-right: 1px solid rgba(255,255,255,.15); margin-right: 4px; white-space: nowrap; }
    .dev-nav__link { color: #d1d5db; text-decoration: none; padding: 5px 10px; border-radius: 999px; white-space: nowrap; transition: background .15s, color .15s; }
    .dev-nav__link:hover { background: rgba(255,255,255,.12); color: #fff; }
    .dev-nav__link.active { background: #6366f1; color: #fff; font-weight: 600; }
  </style>
</head>
<body>

  <!-- 开发期导航(仅 dev 用,可删) -->
  <nav class="dev-nav" aria-label="demo 导航">
    <span class="dev-nav__brand">🧪 demos</span>
    <a href="/" class="dev-nav__link">页面构建</a>
    <a href="/examples/subagent-demo/" class="dev-nav__link">子 Agent</a>
    <a href="/examples/mcp-demo/" class="dev-nav__link">MCP</a>
    <a href="/demo/plain.html" class="dev-nav__link active">CDN</a>
  </nav>

  <div id="root"></div>

  <!-- IIFE 全量:vue / zod / @langchain 全打包进,暴露 window.ChatSdk -->
  <script src="../dist/page-agent-sdk.iife.js"></script>
  <!-- 发布后 CDN:<script src="https://unpkg.com/page-agent-sdk"></script> -->

  <script>
    const { createChatSdk, z } = window.ChatSdk
    // 预置可操作的数据槽
    window.app = { theme: 'light', count: 0 }

    createChatSdk({
      container: '#root',
      id: 'plain-demo',                          // ← 稳定 id:刷新后恢复历史(多 agent 共存各自隔离)
      storage: 'indexed',                        // ← 开启持久化(默认关闭);可选 'session'/'local'/'memory'
      llm: {
        apiKey: 'YOUR_API_KEY',                   // ← 填你的 key
        baseUrl: 'https://api.deepseek.com/v1',   // ← 兼容 OpenAI 协议的接口
        model: 'deepseek-chat',
      },
      systemPrompt:
        '你是页面操作助手。window.app 上注册了可改属性,按用户意图改对应字段即可。',
      dataSlots: [
        { path: 'app.theme', description: '主题', schema: z.enum(['light', 'dark']) },
        { path: 'app.count', description: '计数器(整数)', schema: z.number().int() },
      ],
      debug: true,
      title: '页面内 Agent(CDN)',
      placeholder: '把 app.theme 改成 dark …',
    }).mount()
  </script>
</body>
</html>
