name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支新推送取消旧运行,省 CI 额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions runner 某些环境默认 NODE_ENV=production,会导致 npm ci 跳过 devDependencies
      # → vite(在 devDependencies)不装 → build 报 "vite: not found"
      # 显式设 development 确保 devDependencies 装上
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (lib + iife)
        run: npm run build

      - name: Self-test (630 assertions, tsx 跑源码,无 LLM 依赖)
        run: npm test

      - name: E2E integration (210 assertions,用 dist 产物,无 LLM 依赖)
        run: npm run test:e2e

      - name: Exports consistency (核对 types/index.d.ts 与 src/core/index.ts 导出对齐)
        run: npm run test:exports

      - name: Types check (tsc --noEmit 验证 types/index.d.ts 类型正确)
        run: npm run test:types

      - name: Size check (核对 dist 产物体积不超阈值,防膨胀)
        run: npm run test:size

      - name: Pack dry-run (核对 tarball 不含 .env/src/examples/tests/笔记)
        run: npm pack --dry-run

  build-matrix:
    # 跨 Node 版本构建验证(仅 build,不跑测试,省额度)
    # Vite 8 要求 Node 20+,故只测 20/22
    runs-on: ubuntu-latest
    env:
      # 同 test job:防 NODE_ENV=production 跳过 devDependencies
      NODE_ENV: development
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
